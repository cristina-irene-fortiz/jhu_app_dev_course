<!DOCTYPE html>
<html lang="en" ng-app="LunchCheck">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Check</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body ng-controller="LunchCheckController">
    <div class="container">
        <h1>Lunch Checker</h1>
        <p>Enter comma-separated lunch items:</p>
        
        <!-- Textbox Input -->
        <input type="text" ng-model="lunchItems" placeholder="Enter food items here">
        
        <!-- Button -->
        <button ng-click="checkLunch()">Check If Too Much</button>
        
        <!-- Message Output -->
        <p class="message" ng-style="messageStyle">{{ message }}</p>
    </div>
</body>
</html>
