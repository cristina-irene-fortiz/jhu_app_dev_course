<!DOCTYPE html>
<html lang="en" ng-app="LunchCheck">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch Check</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/angular.min.js"></script>
    <script src="./js/app.js"></script>
</head>

<body ng-controller="LunchCheckController">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header text-center bg-original text-white">
                        <h2>Lunch Checker</h2>
                    </div>
                    <div class="card-body">
                        <p class="text-center">Enter comma-separated lunch items:</p>

                        <!-- Note: Empty items (", ,", ",,,") do not count as items towards the total-->
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" 
                                ng-model="lunchItems"
                                placeholder="Enter food items here"
                                ng-class="borderClass">
                        </div>


                        <div class="text-center">
                            <button class="btn btn-success" ng-click="checkLunch()">
                                Check If Too Much
                            </button>
                        </div>

                        <p class="mt-3 text-center fw-bold" ng-style="messageStyle">{{ message }}</p>

                        <img ng-src="{{ gifUrl }}" alt="Funny GIF" class="img-fluid mt-3" ng-if="gifUrl">


                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
